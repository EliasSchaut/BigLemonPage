# Entwicklungs-Override: MailDev als Mailfänger und kurze Cache-Zeiten.
# Wird nicht automatisch geladen, sondern ausdrücklich mit angegeben:
#
#   docker compose -f compose.yaml -f compose.db.yaml -f compose.dev.yaml up -d

services:
  # Faengt saemtliche ausgehende Mail ab. Weboberflaeche: http://localhost:1080
  maildev:
    networks: [intern]
    image: maildev/maildev:latest
    restart: unless-stopped
    ports:
      - 127.0.0.1:1080:1080 # Weboberflaeche
      - 127.0.0.1:1025:1025 # SMTP
    environment:
      MAILDEV_WEB_PORT: '1080'
      MAILDEV_SMTP_PORT: '1025'
    healthcheck:
      # /healthz gibt es in diesem Image nicht — die API-Route ist der verlaessliche Endpunkt.
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1:1080/api/email']
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    depends_on:
      maildev:
        condition: service_started
    environment:
      # MailDev nimmt alles ohne Authentifizierung und ohne TLS an.
      SMTP_HOST: maildev
      SMTP_PORT: '1025'
      SMTP_SECURE: 'false'
      SMTP_USER: ''
      SMTP_PASS: ''
      SMTP_FROM: BigLemon Website <anfragen@biglemon.de>
      CONTACT_EMAIL: welcome@biglemon.de
      # Kurze TTL, damit CMS-Aenderungen beim Entwickeln sofort sichtbar sind.
      CMS_CACHE_TTL: '5'
