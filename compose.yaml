services:
  postgres:
    networks: [intern]
    image: postgres:17-alpine
    restart: always
    ports:
      # Nur lokal erreichbar — der Datenbankport gehoert nie ins Internet.
      - 127.0.0.1:5432:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER fehlt in der .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in der .env}
      POSTGRES_DB: ${POSTGRES_DB:-directus}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-directus}']
      interval: 5s
      timeout: 5s
      retries: 10

  directus:
    networks: [intern]
    image: directus/directus:12.2.0
    restart: unless-stopped
    ports:
      # Von aussen kommt Directus nur ueber den Reverse Proxy (/cms).
      - 127.0.0.1:8055:8055
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - directus_uploads:/directus/uploads
      - directus_extensions:/directus/extensions
    environment:
      SECRET: ${DIRECTUS_SECRET}
      # Open-Innovation-Grant-Key. Bindet sich beim ersten Start an dieses Projekt
      # UND an PUBLIC_URL — siehe Hinweis in .env.example.
      LICENSE_KEY: ${DIRECTUS_LICENSE_KEY:-}
      DB_CLIENT: pg
      DB_CONNECTION_STRING: ${DIRECTUS_DB_URL:-postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-directus}}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}
      PUBLIC_URL: ${DIRECTUS_PUBLIC_URL:-http://localhost:8055}
      ASSETS_CACHE_TTL: 30d
      ASSETS_TRANSFORM_IMAGE_MAX_OUTPUT_DIMENSION: 6000
      WEBSOCKETS_ENABLED: 'false'
      TELEMETRY: 'false'
      IP_TRUST_PROXY: ${DIRECTUS_TRUST_PROXY:-false}

  web:
    networks: [intern]
    image: kidilias/biglemon:latest
    build:
      context: .
    restart: unless-stopped
    ports:
      - 127.0.0.1:3000:3000
    depends_on:
      directus:
        condition: service_started
    environment:
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      DIRECTUS_URL: http://directus:8055
      DIRECTUS_ASSET_URL: ${DIRECTUS_ASSET_URL:-http://localhost:8055}
      DIRECTUS_TOKEN: ${DIRECTUS_TOKEN:-}
      CMS_CACHE_TTL: ${CMS_CACHE_TTL:-60}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}

networks:
  intern:
    driver: bridge

volumes:
  pgdata:
  directus_uploads:
  directus_extensions:
