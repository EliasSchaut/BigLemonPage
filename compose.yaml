services:
  directus:
    networks: [intern]
    image: directus/directus:12.2.0
    restart: unless-stopped
    ports:
      # Von aussen kommt Directus nur ueber den Reverse Proxy (/cms).
      - 127.0.0.1:8055:8055
    volumes:
      - directus_uploads:/directus/uploads
      - directus_extensions:/directus/extensions
    environment:
      SECRET: ${DIRECTUS_SECRET}
      # Open-Innovation-Grant-Key. Bindet sich beim ersten Start an dieses Projekt
      # UND an PUBLIC_URL — siehe Hinweis in .env.example.
      LICENSE_KEY: ${DIRECTUS_LICENSE_KEY:-}
      DB_CLIENT: pg
      # Datenbank außerhalb des Stacks. Lokal überschreibt compose.db.yaml den Wert
      # mit der gebündelten Postgres.
      DB_CONNECTION_STRING: ${DIRECTUS_DB_URL:-}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}
      PUBLIC_URL: ${DIRECTUS_PUBLIC_URL:-http://localhost:8055}
      ASSETS_CACHE_TTL: 30d
      ASSETS_TRANSFORM_IMAGE_MAX_OUTPUT_DIMENSION: 6000
      WEBSOCKETS_ENABLED: 'false'
      TELEMETRY: 'false'
      IP_TRUST_PROXY: ${DIRECTUS_TRUST_PROXY:-false}

  web:
    networks: [intern]
    image: kidilias/biglemon:latest
    build:
      context: .
    restart: unless-stopped
    ports:
      - 127.0.0.1:3000:3000
    depends_on:
      directus:
        condition: service_started
    environment:
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      DIRECTUS_URL: http://directus:8055
      DIRECTUS_ASSET_URL: ${DIRECTUS_ASSET_URL:-http://localhost:8055}
      DIRECTUS_TOKEN: ${DIRECTUS_TOKEN:-}
      CMS_CACHE_TTL: ${CMS_CACHE_TTL:-60}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}

networks:
  intern:
    driver: bridge

volumes:
  directus_uploads:
  directus_extensions:
